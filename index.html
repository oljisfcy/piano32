<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#232727;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d3e8e2;outline-offset:5px}[hidden]{display:none!important}
.ambient{position:fixed;inset:0;overflow:hidden;z-index:-1;background:radial-gradient(ellipse at 15% 0%,#84847b 0,transparent 60%),linear-gradient(145deg,#486864,#302d2b 65%,#1a1c1e)}.ambient img{width:100%;height:100%;object-fit:cover;filter:blur(24px) brightness(.4);transform:scale(1.2);opacity:.7}
main{width:100%;height:100svh;height:100dvh;max-width:560px;margin:auto;padding:max(12px,env(safe-area-inset-top)) clamp(18px,5vw,38px) max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}.topline{flex:none;display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(8px,2vh,20px);color:#e6ece7a8;font-size:10px;letter-spacing:.22em}.topline span:last-child{letter-spacing:.1em}.player-content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:clamp(0px,2svh,18px)}.artwork{flex:none;aspect-ratio:1;width:min(86%,42svh);max-height:42svh;margin:0 auto clamp(12px,3vh,28px);border-radius:25px;overflow:hidden;position:relative;background:linear-gradient(145deg,#9db4a7,#566f71 45%,#d4b595);box-shadow:0 18px 55px #0003}.artwork img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.default-art{height:100%;display:grid;place-items:center}.record{width:64%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#253332 0 3px,#2c3b39 4px 5px);box-shadow:0 12px 25px #0004;display:grid;place-items:center}.record:after{content:'♪';display:grid;place-items:center;background:#b8cdc0;color:#243d37;width:32%;aspect-ratio:1;border-radius:50%;font-size:30px}
.track-section{flex:none;position:relative;top:clamp(0px,2.5svh,22px)}.song-heading{display:flex;align-items:center;justify-content:space-between;gap:18px}.song-copy{min-width:0;flex:1}h1{font-size:clamp(25px,6vw,36px);line-height:1.2;letter-spacing:-.02em;margin:0 0 9px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}#author{margin:0;color:#dedfddbf;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}time{max-width:35%;font-size:12px;line-height:1.7;color:#d9dcd3a6;text-align:right;white-space:pre-line}#message{flex:none;max-height:5.6em;margin:10px 0 0;font-size:14px;line-height:1.7;color:#e1e7e0bb;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.timeline{flex:none;margin-top:clamp(12px,2.5vh,24px)}.range{display:block;width:100%;height:26px;margin:0;background:transparent;appearance:none;touch-action:pan-y;cursor:pointer}.range::-webkit-slider-runnable-track{height:6px;border-radius:8px;background:linear-gradient(to right,#f4f5ef var(--progress,0%),#ffffff35 var(--progress,0%))}.range::-webkit-slider-thumb{appearance:none;width:7px;height:24px;border-radius:4px;background:#fff;margin-top:-9px}.range::-moz-range-track{height:6px;background:#ffffff35;border-radius:8px}.range::-moz-range-progress{height:6px;background:#fff}.range::-moz-range-thumb{width:7px;height:24px;background:#fff;border:0;border-radius:4px}.times{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums;color:#d2d6cdb3}.controls{flex:none;display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;align-items:center;margin-top:clamp(12px,4vh,34px);gap:10px}.icon-button{border:0;background:none;color:#fff;min-width:44px;min-height:48px;display:grid;place-items:center;padding:8px}.icon-button svg{width:26px;height:26px;fill:currentColor}.play-button{border-radius:50%;background:#ffffff19;width:86px;height:86px;justify-self:center}.play-button svg{width:36px;height:36px}button:disabled{opacity:.3;cursor:default}.control-spacer{width:44px}#status{flex:none;min-height:16px;color:#ddd9;font-size:12px;text-align:center;margin:clamp(8px,2vh,18px) 0 0;line-height:1.5}.retry{flex:none;display:block;margin:8px auto 0;border:1px solid #fff4;border-radius:8px;background:transparent;color:white;padding:8px 18px}
dialog{color:#f5f6f2;background:#222a29;border:1px solid #ffffff1c;border-radius:24px;width:calc(100% - 28px);max-width:500px;max-height:80svh;padding:24px;box-shadow:0 30px 100px #0008}dialog::backdrop{background:#0008;backdrop-filter:blur(8px)}.list-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h2{font-size:23px;margin:0}.track{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #fff1;background:transparent;color:inherit;padding:18px 12px;border-radius:8px}.track[aria-current=true]{background:#ffffff10;color:#d4eddb}.track strong,.track span{display:block;overflow-wrap:anywhere}.track strong{font-size:16px;font-weight:500}.track span{font-size:12px;color:#bbc7bc;margin-top:7px}#listStatus{color:#b9c4bc;font-size:13px;line-height:1.7}#refreshList{font-size:13px;border:0;background:transparent;color:#bddcc8;padding:12px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:350px){main{padding:max(12px,env(safe-area-inset-top)) 20px max(12px,env(safe-area-inset-bottom))}.artwork{margin-bottom:25px}.play-button{width:70px;height:70px}.controls{gap:4px}.song-heading{gap:10px}time{font-size:10px}}
@media(max-height:700px){.topline{margin-bottom:8px}.artwork{width:min(68%,34svh);max-height:34svh;margin-bottom:10px}.track-section{top:clamp(0px,1svh,8px)}.song-heading h1{font-size:clamp(22px,5vh,32px)}#message{margin-top:8px;max-height:2.8em;overflow:hidden}.timeline{margin-top:8px}.controls{margin-top:10px}.play-button{width:68px;height:68px}#status{margin-top:6px}}
.icon-button svg.mode-icon{display:none}.icon-button svg.mode-icon.is-active{display:block}
.mode-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translate(-50%,8px);z-index:3;padding:8px 14px;border:1px solid #ffffff24;border-radius:20px;background:#101716eF;color:#f4f6f2;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}.mode-toast.visible{opacity:1;transform:translate(-50%,0)}
.topline time{max-width:none;font-size:10px;line-height:1;color:#e6ece7a8;text-align:right;white-space:nowrap;letter-spacing:.1em;font-variant-numeric:tabular-nums}
</style>

<body>
<div class="ambient" aria-hidden="true"><img id="background" hidden alt=""></div>
<main>
<div class="topline"><span>PIANO32</span><time id="uploadedAt" hidden></time></div>
<div class="player-content">
<div class="artwork"><div class="default-art" id="defaultCover" aria-label="默认唱片封面"><div class="record"></div></div><img id="cover" hidden alt="歌曲封面"></div>
<div class="track-section">
<div class="song-heading"><div class="song-copy"><h1 id="title">音乐卡片</h1><p id="author">未填写</p></div></div>
<p id="message" hidden></p>
<audio id="audio" preload="metadata" playsinline style="display:none"></audio>
<div class="timeline"><label for="progress" class="sr-only">播放进度</label><input id="progress" class="range" type="range" min="0" max="1000" step="1" value="0" disabled><div class="times"><span id="elapsed">00:00</span><span id="total">00:00</span></div></div>
<div class="controls">
<button id="playbackMode" class="icon-button" aria-label="播放模式：播放完暂停，点击切换" title="播放完暂停">
<svg id="modeOnceIcon" class="mode-icon is-active" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h2l2-4 3 8 3-8 2 4h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 9h5v6h-5z"/></svg>
<svg id="modeSingleIcon" class="mode-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 9a7.5 7.5 0 1 0 .2 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m15.5 5.5 3.8 1.1-.8 3.8z"/></svg>
<svg id="modeSequenceIcon" class="mode-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 12h16m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg id="modeRandomIcon" class="mode-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h2.5c1.5 0 2.7.9 3.7 2.2l6.6 7.6c1 1.2 2.2 2.2 3.7 2.2H22M18.5 15l3.5 3-3.5 3M3 18h2.5c1.5 0 2.7-.9 3.7-2.2l6.6-7.6C16.8 7 18 6 19.5 6H22M18.5 3 22 6l-3.5 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button id="previous" class="icon-button" aria-label="上一首" disabled><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zm15 0v16L9 12z"/></svg></button>
<button id="playToggle" class="icon-button play-button" aria-label="播放" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v18l15-9z"/></svg></button>
<button id="pauseToggle" class="icon-button play-button" aria-label="暂停" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h5v18H5zm9 0h5v18h-5z"/></svg></button>
<button id="next" class="icon-button" aria-label="下一首" disabled><svg viewBox="0 0 24 24"><path d="M16 4h3v16h-3zM4 4l11 8-11 8z"/></svg></button>
<button id="playlistButton" class="icon-button" aria-label="打开播放列表"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3zm0 5h18v2H3zm0 5h10v2H3zm0 5h10v2H3zm13-6 7 5-7 5z"/></svg></button>
</div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p><button id="retry" class="retry" hidden>重试播放</button>
</div>
</div>
</main>
<div id="modeToast" class="mode-toast" role="status" aria-live="polite" hidden></div>
<dialog id="playlist" aria-labelledby="listTitle"><div class="list-heading"><h2 id="listTitle">播放列表</h2><button id="closeList" class="icon-button" aria-label="关闭播放列表">✕</button></div><p id="listStatus" role="status"></p><div id="tracks"></div><button id="refreshList">刷新列表</button></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const audio = $('audio'), status = $('status'), progress = $('progress'), playlist = $('playlist');
const api = 'https://api.github.com/repos/oljisfcy/piano32/git/trees/main?recursive=1';
const roots = [
  {id:'pages', label:'GitHub Pages', url:'https://oljisfcy.github.io/piano32/'},
  {id:'github', label:'GitHub 原文件', url:'https://raw.githubusercontent.com/oljisfcy/piano32/main/'}
];
let songs=[], currentPath='', revision=0, dragging=false, catalogBusy=false;
let sourceIndex=0, watchdog, wantsPlay=false, sourceActive=false, resumeAt=0, catalogVersion=0, renderedList='';
let modeToastTimer, modeToastHideTimer;
const playbackModes=['once','single','sequence','random'];
const playbackModeNames={once:'播放完暂停',single:'单曲循环',sequence:'顺序播放',random:'随机播放'};
let playbackMode='once';
const infoCache=new Map(), infoPending=new Map();
function readCache(key){try{return JSON.parse(localStorage.getItem('piano32.'+key));}catch(_){return null;}}
function writeCache(key,value){try{localStorage.setItem('piano32.'+key,JSON.stringify(value));}catch(_){}}
function validPath(path){return typeof path==='string' && path.length>0 && !/[\\\x00-\x1f\x7f]/.test(path) && path.split('/').every(p=>p && p!=='.' && p!=='..');}
function isMusic(path){return validPath(path) && /\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(path);}
function encodePath(path){return path.split('/').map(encodeURIComponent).join('/');}
function safeCover(path){return validPath(path) && path.startsWith('covers/') && /\.(jpe?g|png|webp)$/i.test(path) ? roots[0].url+encodePath(path) : '';}
function formatTime(value){const s=Number.isFinite(value)?Math.max(0,Math.floor(value)):0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
async function getJson(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}}
function clearWatchdog(){clearTimeout(watchdog);watchdog=null;}
function armWatchdog(){if(!watchdog)watchdog=setTimeout(()=>switchSource(false),7000);}
function resetArtwork(){ $('cover').hidden=true;$('background').hidden=true;$('defaultCover').hidden=false;$('cover').removeAttribute('src');$('background').removeAttribute('src'); }
function renderInfo(path,info={}){
  $('title').textContent=path.split('/').pop().replace(/\.[^.]+$/,'');
  $('author').textContent=typeof info.author==='string' && info.author.trim()?info.author.slice(0,80):'未填写';
  $('message').textContent=typeof info.message==='string'?info.message.slice(0,500):'';$('message').hidden=!$('message').textContent;
  const date=typeof info.uploadedAt==='string'?new Date(info.uploadedAt):null;
  $('uploadedAt').hidden=!date || !Number.isFinite(date.getTime());
  if(!$('uploadedAt').hidden){$('uploadedAt').textContent=`${date.getFullYear()} · ${String(date.getMonth()+1).padStart(2,'0')} · ${String(date.getDate()).padStart(2,'0')}`;$('uploadedAt').setAttribute('datetime',date.toISOString());}
  document.title=$('title').textContent+' · Piano32';
  const cover=safeCover(info.cover);
  if(cover){if($('cover').getAttribute('src')!==cover){$('cover').src=cover;$('background').src=cover;}$('cover').hidden=false;$('background').hidden=false;$('defaultCover').hidden=true;}
  else resetArtwork();
}
async function metadata(path,force=false){
  if(!force && infoCache.has(path))return infoCache.get(path);
  if(infoPending.has(path))return infoPending.get(path);
  const pending=(async()=>{
    for(const root of roots){try{
      const info=await getJson(root.url+encodePath('metadata/'+path+'.json'));
      if(!info || typeof info!=='object' || Array.isArray(info))continue;
      infoCache.set(path,info);writeCache('info:'+path,{time:Date.now(),info});return info;
    }catch(_){}}
    return infoCache.get(path)||{};
  })();
  infoPending.set(path,pending);
  try{return await pending;}finally{infoPending.delete(path);}
}
function updateProgress(){const duration=audio.duration;const valid=Number.isFinite(duration)&&duration>0;progress.disabled=!valid;$('total').textContent=formatTime(duration);if(!dragging){progress.value=valid?String(Math.min(1000,audio.currentTime/duration*1000)):'0';$('elapsed').textContent=formatTime(audio.currentTime);}progress.style.setProperty('--progress',Number(progress.value)/10+'%');}
function syncPlaying(){const playing=!audio.paused;$('playToggle').hidden=playing;$('pauseToggle').hidden=!playing;$('playToggle').disabled=!currentPath;$('pauseToggle').disabled=!currentPath;}
function play(){
  wantsPlay=true;sourceActive=true;armWatchdog();const version=revision;const source=sourceIndex;
  const promise=audio.play();
  if(promise)promise.catch(error=>{
    if(version!==revision || source!==sourceIndex || !wantsPlay)return;
    if(error && error.name==='NotAllowedError'){wantsPlay=false;sourceActive=false;clearWatchdog();status.textContent='播放失败，请点播放重试。';syncPlaying();}
    else if(!error || error.name!=='AbortError')switchSource(false);
  });
}
function assignSource(){
  sourceActive=true;
  audio.pause();audio.src=roots[sourceIndex].url+encodePath(currentPath);audio.load();
  if(wantsPlay)play();else armWatchdog();
}
function switchSource(manual){
  clearWatchdog();if(!currentPath || (!manual && !sourceActive))return;
  resumeAt=Math.max(resumeAt,Number(audio.currentTime)||0);
  if(manual){sourceIndex=(sourceIndex+1)%roots.length;wantsPlay=true;}
  else if(++sourceIndex>=roots.length){sourceIndex=roots.length-1;sourceActive=false;wantsPlay=false;audio.pause();syncPlaying();status.textContent='两个来源均暂时无法播放，请检查网络或音频格式后重试。';$('retry').hidden=false;return;}
  assignSource();
}
function selectSong(path,autoplay=false,changeUrl=true){
  if(!isMusic(path)){status.textContent='链接不完整，请在小程序中重新写卡。';return;}
  revision++;const version=revision;clearWatchdog();currentPath=path;dragging=false;resumeAt=0;sourceIndex=0;wantsPlay=autoplay;
  const cached=readCache('info:'+path);
  if(cached && cached.info && typeof cached.info==='object')infoCache.set(path,cached.info);
  renderInfo(path,infoCache.get(path));$('playToggle').disabled=false;$('pauseToggle').disabled=false;$('retry').hidden=true;progress.value='0';progress.disabled=true;$('elapsed').textContent='00:00';$('total').textContent='00:00';progress.style.setProperty('--progress','0%');
  status.textContent='';
  if(changeUrl)history.replaceState(null,'','#'+encodeURIComponent(path));
  assignSource();syncPlaying();
  if(!cached || !cached.time || Date.now()-cached.time>300000)metadata(path,true).then(info=>{if(version===revision)renderInfo(path,info);});
  renderList();
}
function move(offset){if(!songs.length)return;const index=songs.findIndex(s=>s.path===currentPath);const next=index<0?(offset>0?0:songs.length-1):(index+offset+songs.length)%songs.length;selectSong(songs[next].path,true);}
function setPlaybackMode(mode){
  playbackMode=mode;
  for(const item of playbackModes){const icon=$('mode'+item[0].toUpperCase()+item.slice(1)+'Icon');if(icon)icon.classList.toggle('is-active',item===mode);}
  const name=playbackModeNames[mode];$('playbackMode').title=name;$('playbackMode').setAttribute('aria-label',`播放模式：${name}，点击切换`);
}
function showModeToast(){
  const toast=$('modeToast');
  clearTimeout(modeToastTimer);clearTimeout(modeToastHideTimer);
  toast.textContent=playbackModeNames[playbackMode];toast.hidden=false;
  requestAnimationFrame(()=>toast.classList.add('visible'));
  modeToastTimer=setTimeout(()=>{
    toast.classList.remove('visible');
    modeToastHideTimer=setTimeout(()=>{toast.hidden=true;},180);
  },1400);
}
function playAfterCurrent(){
  if(playbackMode==='single'){
    try{audio.currentTime=0;}catch(_){}
    play();
    return;
  }
  if(playbackMode==='once'||!songs.length)return;
  let nextSong;
  if(playbackMode==='sequence'){
    const index=songs.findIndex(song=>song.path===currentPath);
    if(index<0||index+1>=songs.length)return;
    nextSong=songs[index+1];
  }else{
    const choices=songs.filter(song=>song.path!==currentPath);
    const pool=choices.length?choices:songs;
    nextSong=pool[Math.floor(Math.random()*pool.length)];
  }
  if(nextSong)selectSong(nextSong.path,true);
}
function renderList(){
  $('previous').disabled=!songs.length;$('next').disabled=!songs.length;
  if(!playlist.open)return;
  const key=catalogVersion+':'+currentPath;if(key===renderedList)return;renderedList=key;
  const rows=songs.map(song=>{const button=document.createElement('button');button.className='track';button.setAttribute('aria-current',String(song.path===currentPath));const name=document.createElement('strong');name.textContent=song.path.split('/').pop().replace(/\.[^.]+$/,'');const author=document.createElement('span');const info=infoCache.get(song.path);author.textContent=info && typeof info.author==='string' && info.author.trim()?info.author.slice(0,80):song.path;button.append(name,author);button.addEventListener('click',()=>{playlist.close();selectSong(song.path,true);$('playToggle').focus();});return button;});$('tracks').replaceChildren(...rows);
}
function validCatalog(data){return data && Array.isArray(data.files) && data.files.every(s=>s && s.type==='blob' && isMusic(s.path));}
async function loadCatalog(){
  if(catalogBusy)return;catalogBusy=true;$('refreshList').disabled=true;
  $('listStatus').textContent=songs.length?songs.length+' 首音乐 · 检查更新中':'正在读取仓库…';
  try{
    const data=await getJson(api);if(data.truncated || !Array.isArray(data.tree))throw new Error('incomplete catalog');
    songs=data.tree.filter(file=>file.type==='blob'&&isMusic(file.path)).map(file=>({path:file.path,type:'blob'})).sort((a,b)=>a.path.localeCompare(b.path));
    catalogVersion++;writeCache('catalog',{files:songs,time:Date.now()});renderList();
    $('listStatus').textContent=songs.length?songs.length+' 首音乐':'仓库暂无音乐';
    if(!currentPath && !location.hash && songs.length)selectSong(songs[0].path,false);
    if(!currentPath && !songs.length)status.textContent='仓库暂无音乐';
  }catch(_){$('listStatus').textContent=songs.length?'显示上次列表，更新失败，可稍后刷新。':'列表加载失败，请刷新重试。';if(!currentPath)status.textContent='请打开播放列表后重试加载。';}
  finally{catalogBusy=false;$('refreshList').disabled=false;}
}
function readHash(){try{const path=decodeURIComponent(location.hash.slice(1));if(path)selectSong(path,false,false);}catch(_){status.textContent='歌曲链接无效，请重新写卡。';}}
$('playToggle').addEventListener('click',()=>{if(currentPath)play();});
$('pauseToggle').addEventListener('click',()=>{wantsPlay=false;sourceActive=false;clearWatchdog();audio.pause();});
$('playbackMode').addEventListener('click',()=>{const index=playbackModes.indexOf(playbackMode);setPlaybackMode(playbackModes[(index+1)%playbackModes.length]);showModeToast();});
$('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
progress.addEventListener('input',()=>{dragging=true;$('elapsed').textContent=formatTime(Number(progress.value)/1000*audio.duration);progress.style.setProperty('--progress',Number(progress.value)/10+'%');});
progress.addEventListener('change',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0){try{audio.currentTime=Number(progress.value)/1000*audio.duration;}catch(_){status.textContent='暂时无法跳转到这个位置，请稍后重试。';}}dragging=false;updateProgress();});
$('playlistButton').addEventListener('click',()=>{playlist.showModal();renderList();});$('closeList').addEventListener('click',()=>playlist.close());
$('refreshList').addEventListener('click',()=>{loadCatalog();if(currentPath){const path=currentPath,version=revision;metadata(path,true).then(info=>{if(version===revision)renderInfo(path,info);});}});
$('cover').addEventListener('error',()=>{
  const src=$('cover').getAttribute('src')||'';
  if(src.startsWith(roots[0].url)){const fallback=roots[1].url+src.slice(roots[0].url.length);$('cover').src=fallback;$('background').src=fallback;}else resetArtwork();
});
audio.addEventListener('loadedmetadata',()=>{if(resumeAt>0){try{audio.currentTime=resumeAt;}catch(_){}resumeAt=0;}updateProgress();});
audio.addEventListener('canplay',clearWatchdog);
audio.addEventListener('durationchange',updateProgress);audio.addEventListener('timeupdate',()=>{if(!audio.paused && audio.currentTime>0)clearWatchdog();updateProgress();});
audio.addEventListener('play',syncPlaying);audio.addEventListener('playing',()=>{clearWatchdog();$('retry').hidden=true;syncPlaying();});
audio.addEventListener('pause',syncPlaying);
audio.addEventListener('waiting',()=>{if(wantsPlay)armWatchdog();});
audio.addEventListener('stalled',()=>{if(wantsPlay)armWatchdog();});
audio.addEventListener('ended',()=>{clearWatchdog();wantsPlay=false;sourceActive=false;syncPlaying();playAfterCurrent();});
audio.addEventListener('error',()=>{if(currentPath)switchSource(false);});
$('retry').addEventListener('click',()=>{if(currentPath)selectSong(currentPath,true);});
window.addEventListener('hashchange',readHash);window.addEventListener('pagehide',()=>{wantsPlay=false;sourceActive=false;clearWatchdog();audio.pause();});
const savedCatalog=readCache('catalog');
if(validCatalog(savedCatalog)){songs=savedCatalog.files;catalogVersion++;$('listStatus').textContent=songs.length+' 首音乐 · 本机缓存';}
readHash();
setPlaybackMode(playbackMode);
if(!currentPath && !location.hash && songs.length)selectSong(songs[0].path,false);
renderList();loadCatalog();
</script>
</body>
</html>
